# Entorno del laboratorio de IA (semanas 7 y 8)
#
#   docker compose up -d                  -> SQL Server + Ollama + modelos + datos
#   docker compose --profile api up -d    -> además levanta la API de IA en un contenedor
#
# La API también puede ejecutarse desde Visual Studio (perfil http, puerto 5080):
# se conecta a SQL Server en localhost,14330 y a Ollama en localhost:11434.
name: uesan-shopping-ai

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-Uesan_2026!}
      MSSQL_PID: Developer
    ports:
      - "14330:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Ejecuta docker/sql/*.sql en orden. Los scripts son idempotentes:
  # cada vez que avances de hito, vuelve a correr "docker compose up -d".
  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-Uesan_2026!}
    volumes:
      - ./docker/sql:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    # Con GPU NVIDIA (opcional): descomenta
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Descarga los modelos locales una sola vez (quedan en el volumen "ollama").
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${CHAT_MODEL:-qwen2.5:3b} && ollama pull ${EMBED_MODEL:-bge-m3}"]
    restart: "no"

  ai-api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: UESAN.SHOPPING.AI.API/Dockerfile
    depends_on:
      sql-init:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ShoppingAI: Server=sqlserver;Database=UesanShoppingAI;User Id=sa;Password=${SQL_SA_PASSWORD:-Uesan_2026!};TrustServerCertificate=True
      AI__Ollama__Endpoint: http://ollama:11434
    ports:
      - "5080:8080"

volumes:
  sqldata:
  ollama:
